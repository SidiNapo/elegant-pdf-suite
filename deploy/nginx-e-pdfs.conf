# Nginx front for the self-hosted E-Pdf's deployment.
# Install: /etc/nginx/sites-available/e-pdfs.conf  (symlink into sites-enabled)
#
# Run `certbot --nginx -d e-pdfs.com -d www.e-pdfs.com` AFTER DNS points at this
# box. Certbot rewrites these server blocks to add the 443 listeners and the
# http -> https redirect; keep the apex -> www redirect below intact.

# Apex -> www, 301 permanent (mirrors the "redirects" block in vercel.json).
server {
    listen 80;
    listen [::]:80;
    server_name e-pdfs.com;
    return 301 https://www.e-pdfs.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.e-pdfs.com;

    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}
